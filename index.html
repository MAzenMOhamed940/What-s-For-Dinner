<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>What's For Dinner</title>
  </head>

  <body>
    <!--? ========== Start NavBar ========== -->
    <nav class="navbar py-3 navbar-expand-lg my-nav">
      <div class="container">
        <div class="logo d-flex align-items-center gap-3">
          <div class="icon">
            <i class="fa-solid fa-utensils"></i>
          </div>
          <div class="text">
            <h1 class="fs-4 m-0 fw-bold">What's For Dinner</h1>
            <p class="m-0 text-black-50">Your daily meal inspiration</p>
          </div>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav align-items-center ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="fa-solid fa-bookmark"></i>
                <span class="d-inline d-lg-none">Saved Recipes</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="fa-solid fa-clock-rotate-left"></i>
                <span class="d-inline d-lg-none">Recent</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><i class="fa-solid fa-gear"></i>
                <span class="d-inline d-lg-none">Settings</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"
                ><div class="profile-image d-flex align-items-center gap-2">
                  <img
                    src="./images/avatar-4.jpg"
                    class="w-100 d-block"
                    alt="person photo"
                  />
                  <span class="d-inline d-lg-none">Profile</span>
                </div></a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!--? ========== End NavBar ========== -->

    <!--? ========= Start Header ========== -->

    <header class="py-5">
      <div class="container">
        <div id="mealBox" class="row main g-0"></div>
      </div>
    </header>
    <!-- ?========== End Header ========== -->

    <script src="./js/bootstrap.bundle.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
